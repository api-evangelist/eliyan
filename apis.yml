aid: eliyan
name: Eliyan
description: 'Eliyan Corporation is a fabless semiconductor company in Santa Clara,
  California that develops chiplet and chip-to-chip interconnect physical-layer (PHY)
  IP for multi-die and AI infrastructure systems. Its NuLink die-to-die and die-to-memory
  PHY, NuLink-X chip-to-chip PHY, NuLink-XD 224G PAM4 SerDes for electro-optical modules,
  and NuGear chiplets let designers build multi-die architectures on standard organic
  substrates as well as advanced packaging, using simultaneous bidirectional signaling
  and support for UCIe, Bunch of Wires (BoW) and its own UMI interface. Eliyan licenses
  silicon IP and sells chiplets to semiconductor and hyperscale customers rather than
  operating a public web API; the company publishes no developer portal, API documentation,
  or machine-readable API contract.'
